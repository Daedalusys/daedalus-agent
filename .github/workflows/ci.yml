---
# daedalus-agent CI —— 本仓此前 0 个 workflow。
#
# agent#2(install.sh 的 ExecStart 缺 `daemon` 子命令,装机后 daemon 必死)能进 main,
# 根因就是这里没有任何 CI。本 workflow 补两道路:
#   go-test     : go vet + go test -race,守住编译与单测;
#   install-test: 在真 systemd 容器里跑 install.sh,断言 systemctl is-active == active
#                 —— 正是 agent#2 那条漏网路径(单元写了但 argv 必崩)。
#
# 布局:主仓检出到 daedalus-agent/ 子目录(SDK 必须检出到平级的 daedalus-sdk/,
# 否则 go.mod 的 `replace => ../daedalus-sdk` 解析不到)。
name: daedalus-agent CI
on:
  push:
    # 纯文档改动不触发。
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  go-test:
    name: Go Test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout agent
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: daedalus-agent
      - name: Checkout SDK (sibling; go.mod 的 replace => ../daedalus-sdk)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Daedalusys/daedalus-sdk
          path: daedalus-sdk
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache-dependency-path: |
            daedalus-agent/go.sum
            daedalus-sdk/go.sum
      - name: Go vet
        working-directory: daedalus-agent
        run: go vet ./...
      - name: Go test
        working-directory: daedalus-agent
        run: go test -race -count=1 ./...

  install-test:
    name: Install E2E (systemd container)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout agent
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: daedalus-agent
      - name: Checkout SDK (sibling)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Daedalusys/daedalus-sdk
          path: daedalus-sdk
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache-dependency-path: |
            daedalus-agent/go.sum
            daedalus-sdk/go.sum
      - name: install_test.sh
        working-directory: daedalus-agent
        run: bash scripts/install_test.sh
